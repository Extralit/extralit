coverage:
  status:
    project:
      default:
        enabled: false
    patch:
      default:
        enabled: false

flags:
  frontend:
    paths:
      - argilla-frontend/
    carryforward: true
  argilla:
    paths:
      - extralit/src/argilla/
    carryforward: true
  extralit:
    paths:
      - extralit/src/extralit/
    carryforward: true
  argilla_v1:
    paths:
      - argilla-v1/src/argilla_v1/
    carryforward: true
  argilla_server:
    paths:
      - argilla-server/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto

  individual_components:
    - component_id: extralit
      paths:
        - extralit/src/extralit/**

    - component_id: argilla
      name: argilla
      paths:
        - extralit/src/argilla/**

    - component_id: argilla_v1
      name: argilla_v1
      paths:
        - argilla-v1/src/argilla_v1/**

    - component_id: argilla-server
      paths:
        - argilla-server/**

    - component_id: argilla-frontend
      paths:
        - argilla-frontend/**
