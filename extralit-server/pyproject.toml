[project]
name = "extralit-server"
dynamic = ["version"]
description = "Open-source tool for accurate & fast scientific literature data extraction with LLM and human-in-the-loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
    "literature-review",
    "data-annotation",
    "artificial-intelligence",
    "machine-learning",
    "human-in-the-loop",
    "mlops",
]
authors = [
    { name = "Extralit Labs", email = "extralit.contact@gmail.com" },
]
maintainers = [
    { name = "Extralit Labs", email = "extralit.contact@gmail.com" },
]
dependencies = [
    # Basic dependencies
    "fastapi ~= 0.115.0",
    "pydantic ~= 2.9.0",
    "pydantic-settings ~= 2.6.0",
    "uvicorn[standard] ~= 0.32.0",
    "opensearch-py ~= 2.0.0",
    "elasticsearch8[async] ~= 8.7.0",
    "brotli-asgi ~= 1.4.0",
    "tenacity>=9.1.2",
    # Database dependencies
    "alembic ~= 1.13.0",
    "SQLAlchemy ~= 2.0.0",
    "greenlet ~= 3.1.0",
    # Async SQLite
    "aiosqlite == 0.20.0",
    # Statics server
    "aiofiles ~= 24.1.0",
    "PyYAML >= 5.4.1,< 6.1.0",
    # security dependencies
    "python-jose[cryptography] ~= 3.3.0",
    "bcrypt ~= 4.2.0",
    # required by fastapi
    "python-multipart ~= 0.0.16",
    # OAuth2 integration
    "httpx ~= 0.27.0",
    "oauthlib ~= 3.2.0",
    "social-auth-core ~= 4.5.0",
    # Background processing
    "rq~=2.4.1",
    "lazy-loader>=0.4",
    # Info status
    "psutil ~= 5.8, <5.10",
    # For logging, tracebacks, printing, progressbars
    "rich != 13.1.0",
    # For CLI
    "typer>=0.19.1", # spaCy only supports typer<0.10.0
    "click >= 8.2.0", # click >=8.2.0 has TypeError: Parameter.make_metavar() missing 1 required positional argument: 'ctx'
    "packaging>=23.2",
    # For Webhooks
    "standardwebhooks>=1.0.0",
    # For HF dataset import
    "datasets>=3.6.0",
    "pillow>=10.1.0",
    # NumPy 2.x compatibility
    "numpy>=2.0.0,<3.0.0",
    # For Telemetry
    "huggingface-hub~=0.34.0",
    "Jinja2>=3.1.4",           # Used by huggingface-hub to render dataset card templates
    # For file storage
    "aioboto3>=13.1.1",
    "types-aiobotocore-s3==2.24.2",
    # For document processing
    "ocrmypdf>=16.11.0",
    "pdf2image>=1.17.0",
    "opencv-python-headless>=4.11.0.86",
]

[project.optional-dependencies]
postgresql = [
    "psycopg2 ~= 2.9.0",
    # Async PostgreSQL
    "asyncpg ~= 0.30.0",
]
marker = [
    "marker-pdf>=1.9.3",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.51.0",
]

[project.urls]
homepage = "https://extralit.ai"
documentation = "https://docs.extralit.ai"
repository = "https://github.com/extralit/extralit"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/extralit_server/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/extralit_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/extralit_server/static" = "extralit_server/static"

[tool.hatch.build]
exclude = [".env.dev", ".env.test"]

[dependency-groups]
test = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio~=1.1.0",
    "pytest-env>=1.1.3",
    "factory-boy~=3.2.1",
    "httpx>=0.26.0",
    "pytest-randomly>=3.16.0",
    # For mocking httpx requests and responses
    "respx>=0.21.1",
    "ruff>=0.12.11"
]

[tool.pytest.ini_options]
log_format = "%(asctime)s %(name)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests"]
env = ["HF_HUB_DISABLE_TELEMETRY=1"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
concurrency = ["greenlet", "thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if _TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (undefined names, logical issues)
    "E7",   # Syntax/indentation errors
    "E9",   # Runtime-like errors
    "E4",   # Import-related errors (E401, E402, etc.)
    "B012", # return in finally (can suppress real exceptions)
    "B",    # flake8-bugbear (broader than just B012)
    "C4",   # flake8-comprehensions
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "ASYNC", # flake8-async - async/await specific rules
    "PLE",   # pylint errors (includes await-outside-async)
    "FAST",  # FastAPI-specific rules (valuable for your backend)
    "RUF",   # ruff-specific rules
]

ignore = [
    "E402",   # imports not at top (lazy / optional import patterns)
    "B904",   # exception chaining (will phase in later)
    "UP007",  # | union syntax modernization
    "UP045",  # Optional[...] -> X | None modernization
    "UP038",
    "B027",   # empty abstract method not marked abstract
    "B024",   # abstract base class without abstract methods
    "B017",   # broad exception asserts in tests
    "RUF012", # mutable class var typing inference
    "B008",   # FastAPI Depends pattern
    "FAST002", # FastAPI Depends suggestion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "I001"]  # Ignore unused imports and wildcard imports in __init__.py
"tests/**/*.py" = ["ASYNC", "F821"]  # More lenient async rules in tests (ignore undefined names like forward refs/fixtures)
"src/extralit_server/cli/**/*.py" = ["UP007", "UP045"]  # Typer doesn't support new union syntax

# Legacy PDM scripts retained for backward compatibility with pdm run commands.
# Preferred: use uv run directly, e.g. `uv run pytest tests`, `uv run ruff check`
[tool.pdm.scripts]
_.env_file = ".env.dev"
cli = { cmd = "python -m extralit_server.cli" }
server = { cmd = "uvicorn extralit_server:app --host 0.0.0.0 --port 6900 --reload" }
migrate = { cmd = "alembic upgrade head" }
alembic = { cmd = "alembic -c src/extralit_server/alembic.ini" }
revision = { cmd = "alembic -c src/extralit_server/alembic.ini revision --autogenerate" }
worker = { cmd = "python -m extralit_server worker" }
reindex = { cmd = "python -m extralit_server search-engine reindex" }
server-dev.composite = [
    "migrate",
    "cli database users create_default",
    "server",
]
server-and-worker = { shell = "pdm run server & pdm run worker & wait" }
test = { cmd = "pytest --verbosity=1 --disable-warnings", env_file = ".env.test" }
test-cov = { cmd = "pytest tests --cov=extralit_server --cov-report=term --cov-report=xml --verbosity=0 --disable-warnings", env_file = ".env.test" }
lint = "ruff check"

docker-build-extralit-server = { shell = "uv build && cp -R dist docker/server && docker build -t extralit/extralit-server:local docker/server" }
