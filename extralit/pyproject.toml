[project]
name = "extralit"
description = "Open-source tool for accurate & fast scientific literature data extraction with LLM and human-in-the-loop."
authors = [
    { name = "Extralit Labs", email = "extralit.contact@gmail.com" },
]
maintainers = [
    { name = "Extralit Labs", email = "extralit.contact@gmail.com" },
]
requires-python = ">=3.9.2, <3.14"
readme = "README.md"
license = { text = "Apache 2.0" }

dynamic = ["version"]

dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.6.0, <3.0.0",
    "huggingface_hub>=0.22.0",
    "tqdm>=4.60.0",
    "rich>=10.0.0",
    "datasets~=3.6.0",
    "pillow>=9.5.0",
    "standardwebhooks>=1.0.0",
    "typer>=0.9.0",
    "lazy-loader>=0.4",
    "bibtexparser>=1.4.3",
    "pandera[io]>=0.26.1, < 0.27.0",
    "pandas>=2.3.2",
]
nlp = [
    "textdescriptives",
    "setfit ~= 0.7.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/extralit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/extralit"]

[tool.ty.environment]
# Match requires-python; ty otherwise infers from the active interpreter.
python-version = "3.9"
python = ".venv"

[tool.ty.src]
root = "./src"

[tool.ruff]
line-length = 120
extend-exclude = ["src/extralit/v2/_api/_generated.py"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (undefined names, logical issues)
    "E7",   # Syntax/indentation errors
    "E9",   # Runtime-like errors
    "E4",   # Import-related errors (E401, E402, etc.)
    "B012", # return in finally (can suppress real exceptions)
    "B",    # flake8-bugbear (broader than just B012)
    "C4",   # flake8-comprehensions
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "ASYNC", # flake8-async - async/await specific rules
    "PLE",   # pylint errors (includes await-outside-async)
    "FAST",  # FastAPI-specific rules (valuable for your backend)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E402",
    "B904",
    "UP007",
    "UP045",
    "B027",
    "B024",
    "B017",
    "RUF012",
    "B008",
    "FAST002",
    "B023"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "I001"]
"tests/**/*.py" = ["ASYNC", "F821"]
"src/extralit/cli/**/*.py" = ["UP007", "UP045"]


[dependency-groups]
dev = [
    "ipython>=8.12.3",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio~=1.1.0",
    "flake8>=5.0.4",
    "ruff>=0.1.12",
    "pytest-mock>=3.12.0",
    "pytest-httpx ~=0.29.0",
    "build>=1.0.3",
    "pre-commit>=3.5.0",
    "mkdocs-material >= 9.5.17",
    "mkdocstrings[python] >= 0.24.0",
    "mkdocs-literate-nav >= 0.6.1",
    "mkdocs-section-index >= 0.3.8",
    "mkdocs-gen-files >= 0.5.0",
    "mkdocs-open-in-new-tab >= 1.0.3",
    "material-plausible-plugin>=0.2.0",
    "mike >= 2.0.0",
    "Pillow >= 9.5.0",
    "CairoSVG >= 2.7.1",
    "mknotebooks >= 0.8.0",
    "pytest-retry>=1.5",
    "ty>=0.0.46",
    "datamodel-code-generator>=0.26,<0.69",
]

[project.scripts]
extralit = "extralit.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
env = ["HF_HUB_DISABLE_TELEMETRY=1"]
markers = [
    "slow: marks tests as slow / network-dependent (e.g. live Hugging Face Hub). Omitted by default; run with --runslow.",
]
