services:
  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  extralit:
    image: extralitdev/extralit-hf-space:latest
    environment:
      HF_HUB_DISABLE_TELEMETRY: 1
      EXTRALIT_BASE_URL: /extralit
      USERNAME: extralit
      PASSWORD: ${EXTRALIT_PASSWORD:?set EXTRALIT_PASSWORD}
      API_KEY: ${EXTRALIT_API_KEY:?set EXTRALIT_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extralit.rule=PathPrefix(`/extralit/`)"
      - "traefik.http.routers.extralit.entrypoints=web"
      - "traefik.http.services.extralit.loadbalancer.server.port=6900"
