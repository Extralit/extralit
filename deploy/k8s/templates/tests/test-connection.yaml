apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "extralit.fullname" . }}-test-connection"
  labels:
    {{- include "extralit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args: ["-qO-", "http://{{ include "extralit.fullname" . }}:{{ .Values.extralit.service.port }}{{ trimSuffix "/" .Values.extralit.baseUrl }}/api/v1/version"]
  restartPolicy: Never
