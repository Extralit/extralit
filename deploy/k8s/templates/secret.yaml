{{- $name := printf "%s-secrets" (include "extralit.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $authSecretKey := .Values.extralit.authSecretKey }}
{{- if not $authSecretKey }}
{{- $authSecretKey = $existing.data | default dict | dig "auth-secret-key" "" | b64dec | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "extralit.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret-key: {{ $authSecretKey | quote }}
  password: {{ .Values.extralit.auth.password | quote }}
  api-key: {{ .Values.extralit.auth.apiKey | quote }}
  database-url: {{ include "extralit.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
  {{- if not .Values.elasticsearch.useOperator }}
  elasticsearch-url: {{ required "externalElasticsearch.url is required when elasticsearch.useOperator is false" .Values.externalElasticsearch.url | quote }}
  {{- end }}
  {{- if .Values.storage.s3.accessKey }}
  s3-access-key: {{ .Values.storage.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.storage.s3.secretKey | quote }}
  {{- end }}
