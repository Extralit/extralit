{{- $authSecretKey := include "extralit.secretValue" (dict "ctx" . "key" "auth-secret-key" "value" .Values.extralit.authSecretKey) }}
{{- $password := include "extralit.secretValue" (dict "ctx" . "key" "password" "value" .Values.extralit.auth.password) }}
{{- $apiKey := include "extralit.secretValue" (dict "ctx" . "key" "api-key" "value" .Values.extralit.auth.apiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "extralit.fullname" . }}-secrets
  labels:
    {{- include "extralit.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret-key: {{ $authSecretKey | quote }}
  password: {{ $password | quote }}
  api-key: {{ $apiKey | quote }}
  {{- if .Values.postgresql.enabled }}
  {{- $pgPassword := include "extralit.secretValue" (dict "ctx" . "key" "postgres-password" "value" .Values.postgresql.auth.password) }}
  postgres-password: {{ $pgPassword | quote }}
  {{- with .Values.postgresql.auth }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" (urlquery .username | replace "+" "%20") (urlquery $pgPassword | replace "+" "%20") (include "extralit.postgresqlName" $) .database | quote }}
  {{- end }}
  {{- else }}
  database-url: {{ required "externalDatabase.url is required when postgresql.enabled is false" .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if not .Values.elasticsearch.useOperator }}
  elasticsearch-url: {{ required "externalElasticsearch.url is required when elasticsearch.useOperator is false" .Values.externalElasticsearch.url | quote }}
  {{- end }}
  {{- if .Values.storage.s3.accessKey }}
  s3-access-key: {{ .Values.storage.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.storage.s3.secretKey | quote }}
  {{- end }}
