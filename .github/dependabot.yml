version: 2
updates:
  - package-ecosystem: uv
    directories: ["/extralit", "/extralit-server"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /extralit-frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      perspective:
        patterns: ["@perspective-dev/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
