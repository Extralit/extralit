version: 2
updates:
  - package-ecosystem: uv
    directory: /extralit
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  # Bump pyproject.toml lower bounds too, so re-locking can't downgrade.
  - package-ecosystem: uv
    directory: /extralit-server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      server-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /extralit-frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
