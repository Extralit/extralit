name: Build extralit-server docker images

on:
  workflow_call:
    inputs:
      is_release:
        description: "True if the images should be built for release"
        required: true
        type: boolean

      publish_latest:
        description: "True if the images should be published as latest"
        required: true
        type: boolean

      pr_number:
        description: "When set (manual PR preview), tag the dev image pr-<n> and dispatch branch <n>/merge so the HF Space repo deploys extralit-dev/pr-<n>."
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Extralit server docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Read package info
        id: package-info
        run: |
          PACKAGE_VERSION=$(python3 scripts/bump_version.py check)
          PACKAGE_NAME="extralit-server"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "$PACKAGE_NAME==$PACKAGE_VERSION"

      - name: Get Docker image tag from GITHUB_REF
        if: ${{ !inputs.is_release }}
        id: docker-image-tag-from-ref
        uses: ./.github/actions/docker-image-tag-from-ref

      - name: Setup environment variables
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            echo "DISPATCH_BRANCH=$PR_NUMBER/merge" >> $GITHUB_ENV
          else
            echo "DISPATCH_BRANCH=$REF_NAME" >> $GITHUB_ENV
          fi
          if [[ $IS_RELEASE == true ]]; then
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
            echo "IMAGE_TAG=v$PACKAGE_VERSION" >> $GITHUB_ENV
            echo "SERVER_DOCKER_IMAGE=extralit/extralit-server" >> $GITHUB_ENV
            echo "HF_SPACES_DOCKER_IMAGE=extralit/extralit-hf-space" >> $GITHUB_ENV
            echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> $GITHUB_ENV
            echo "DOCKER_PASSWORD=$DOCKER_PASSWORD" >> $GITHUB_ENV
            echo "PUBLISH_LATEST=$PUBLISH_LATEST" >> $GITHUB_ENV
          else
            echo "PLATFORMS=linux/amd64" >> $GITHUB_ENV
            echo "SERVER_DOCKER_IMAGE=extralitdev/extralit-server" >> $GITHUB_ENV
            echo "HF_SPACES_DOCKER_IMAGE=extralitdev/extralit-hf-space" >> $GITHUB_ENV
            echo "DOCKER_USERNAME=$DOCKER_USERNAME_DEV" >> $GITHUB_ENV
            echo "DOCKER_PASSWORD=$DOCKER_PASSWORD_DEV" >> $GITHUB_ENV
            if [[ -n "$PR_NUMBER" ]]; then
              # Manual PR preview: force the identifiable pr-<n> tag and don't move dev :latest.
              echo "IMAGE_TAG=pr-$PR_NUMBER" >> $GITHUB_ENV
              echo "PUBLISH_LATEST=false" >> $GITHUB_ENV
            else
              echo "IMAGE_TAG=$DOCKER_IMAGE_TAG" >> $GITHUB_ENV
              echo "PUBLISH_LATEST=true" >> $GITHUB_ENV
            fi
          fi
        env:
          IS_RELEASE: ${{ inputs.is_release }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REF_NAME: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.package-info.outputs.PACKAGE_VERSION }}
          DOCKER_IMAGE_TAG: ${{ steps.docker-image-tag-from-ref.outputs.docker-image-tag }}
          DOCKER_USERNAME: ${{ secrets.AR_DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.AR_DOCKER_PASSWORD }}
          DOCKER_USERNAME_DEV: ${{ secrets.AR_DOCKER_USERNAME_DEV }}
          DOCKER_PASSWORD_DEV: ${{ secrets.AR_DOCKER_PASSWORD_DEV }}

      - name: Set up QEMU
        if: ${{ inputs.is_release }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Download python package
        uses: actions/download-artifact@v4
        with:
          name: extralit-server
          path: extralit-server/docker/server/dist

      - name: Build and push `extralit-server` image
        uses: docker/build-push-action@v5
        with:
          context: extralit-server/docker/server
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.SERVER_DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Test CLI command in docker image
        run: |
          docker run --rm ${{ env.SERVER_DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} python -m extralit_server start --help

      - name: Push latest `extralit-server` image
        if: ${{ env.PUBLISH_LATEST == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: extralit-server/docker/server
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.SERVER_DOCKER_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      # Cross-repo, so the token must be scoped past this repository explicitly: GITHUB_TOKEN
      # can only ever reach the repo it was issued for. `repositories` narrows the installation
      # token to just the dispatch target rather than everything the App can see.
      - name: Mint an app token for the HF-Space dispatch
        id: dispatch-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.EXTRALIT_OPS_CLIENT_ID }}
          private-key: ${{ secrets.EXTRALIT_OPS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: extralit-hf-space

      - name: Trigger HF-Space build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: extralit/extralit-hf-space
          event-type: build-hf-space
          # DISPATCH_BRANCH is <n>/merge for manual PR previews (so resolve-env routes to
          # pr_space_slug=pr-<n>), otherwise github.ref_name. Computed in "Setup environment variables".
          client-payload: '{"tag":"${{ env.IMAGE_TAG }}","is_release":${{ inputs.is_release }},"branch":"${{ env.DISPATCH_BRANCH }}"}'

      - name: Docker Hub Description for `extralit-server`
        uses: peter-evans/dockerhub-description@v4
        if: ${{ env.TAG_LATEST == 'true' }}
        # Cosmetic: a scoped Docker Hub token without admin on the repo returns Forbidden here,
        # which would fail the job and paint a successful build + dispatch red.
        continue-on-error: true
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          repository: ${{ env.SERVER_DOCKER_IMAGE }}
          readme-filepath: extralit-server/docker/server/README.md
