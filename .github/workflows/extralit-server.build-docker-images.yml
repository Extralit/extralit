name: Build extralit-server docker images

on:
  workflow_call:
    inputs:
      is_release:
        description: "True if the images should be built for release"
        required: true
        type: boolean

      publish_latest:
        description: "True if the images should be published as latest"
        required: true
        type: boolean

      pr_number:
        description: "When set (manual PR preview), tag the dev image pr-<n> and dispatch branch <n>/merge so the HF Space repo deploys extralit-dev/pr-<n>."
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Extralit server docker images
    runs-on: ubuntu-latest

    env:
      # <n>/merge for manual PR previews, so the HF-Space repo's resolve-env routes to
      # pr_space_slug=pr-<n>; otherwise the ref that triggered the build.
      DISPATCH_BRANCH: ${{ inputs.pr_number != '' && format('{0}/merge', inputs.pr_number) || github.ref_name }}
      PLATFORMS: ${{ inputs.is_release && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      SERVER_DOCKER_IMAGE: ${{ inputs.is_release && 'extralit/extralit-server' || 'extralitdev/extralit-server' }}
      HF_SPACES_DOCKER_IMAGE: ${{ inputs.is_release && 'extralit/extralit-hf-space' || 'extralitdev/extralit-hf-space' }}
      # A PR preview never moves dev :latest.
      PUBLISH_LATEST: ${{ (inputs.is_release && inputs.publish_latest) || (!inputs.is_release && inputs.pr_number == '') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Read package info
        id: package-info
        run: |
          PACKAGE_VERSION=$(python3 scripts/bump_version.py check)
          PACKAGE_NAME="extralit-server"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "$PACKAGE_NAME==$PACKAGE_VERSION"

      - name: Get Docker image tag from GITHUB_REF
        if: ${{ !inputs.is_release }}
        id: docker-image-tag-from-ref
        uses: ./.github/actions/docker-image-tag-from-ref

      - name: Resolve the image tag
        run: echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
        env:
          TAG: >-
            ${{ inputs.is_release && format('v{0}', steps.package-info.outputs.PACKAGE_VERSION)
            || (inputs.pr_number != '' && format('pr-{0}', inputs.pr_number)
            || steps.docker-image-tag-from-ref.outputs.docker-image-tag) }}

      - name: Set up QEMU
        if: ${{ inputs.is_release }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.is_release && secrets.AR_DOCKER_USERNAME || secrets.AR_DOCKER_USERNAME_DEV }}
          password: ${{ inputs.is_release && secrets.AR_DOCKER_PASSWORD || secrets.AR_DOCKER_PASSWORD_DEV }}

      - name: Download python package
        uses: actions/download-artifact@v4
        with:
          name: extralit-server
          path: extralit-server/docker/server/dist

      # Only `labels` is consumed downstream; tags come from IMAGE_TAG, not from this step.
      - name: Extract OCI image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_DOCKER_IMAGE }}

      - name: Build and push `extralit-server` image
        uses: docker/build-push-action@v5
        with:
          context: extralit-server/docker/server
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.SERVER_DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the wheel differs between two builds of the same tree; the lance extension
          # fetch and both apt layers do not. image-manifest is what Docker Hub accepts.
          cache-from: type=registry,ref=${{ env.SERVER_DOCKER_IMAGE }}:buildcache
          cache-to: ${{ inputs.pr_number == '' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.SERVER_DOCKER_IMAGE) || '' }}
          push: true

      - name: Test CLI command in docker image
        run: |
          docker run --rm ${{ env.SERVER_DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} python -m extralit_server start --help

      - name: Push latest `extralit-server` image
        if: ${{ env.PUBLISH_LATEST == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: extralit-server/docker/server
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.SERVER_DOCKER_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.SERVER_DOCKER_IMAGE }}:buildcache
          push: true

      # Cross-repo, so the token must be scoped past this repository explicitly: GITHUB_TOKEN
      # can only ever reach the repo it was issued for. `repositories` narrows the installation
      # token to just the dispatch target rather than everything the App can see.
      - name: Mint an app token for the HF-Space dispatch
        id: dispatch-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.EXTRALIT_OPS_CLIENT_ID }}
          private-key: ${{ secrets.EXTRALIT_OPS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: extralit-hf-space

      - name: Trigger HF-Space build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: extralit/extralit-hf-space
          event-type: build-hf-space
          client-payload: '{"tag":"${{ env.IMAGE_TAG }}","is_release":${{ inputs.is_release }},"branch":"${{ env.DISPATCH_BRANCH }}"}'
