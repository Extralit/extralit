name: Build Extralit frontend package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:

  push:
    branches:
      - main
      - develop
      - releases/**
    paths:
      - "extralit-frontend/**"
      - ".github/workflows/extralit-frontend.yml"

  pull_request:
    paths:
      - "extralit-frontend/**"
      - ".github/workflows/extralit-frontend.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    name: Build extralit-frontend
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extralit-frontend

    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies 📦
        run: |
          npm install

      - name: Run lint 🧹
        continue-on-error: true
        run: |
          npm run lint

      - name: Run tests with coverage 🧪
        id: run-tests
        run: |
          npm run test:coverage

      - name: Upload frontend test coverage
        if: always()
        uses: codecov/codecov-action@v5.4.3
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build package 📦
        env:
          # Nuxt 4 SPA (ssr:false) ships as static files served at the site root, so build at
          # base "/". (The Nuxt 2 "@@baseUrl@@" placeholder breaks Nuxt 4's prerender crawler;
          # parameterizable sub-path hosting is a separate follow-up.)
          BASE_URL: "/"
        run: |
          # `nuxi generate` prerenders the SPA shell to .output/public (index.html + _nuxt
          # assets); `nuxi build` only emits a Nitro server with no static index.html.
          npm run generate

      - name: Upload frontend statics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extralit-frontend
          path: extralit-frontend/.output/public

  deploy:
    name: Deploy to Vercel
    needs: build
    # PRs -> Vercel preview; develop/main -> production. Skip drafts and fork PRs (no secrets
    # for the Vercel token or the cross-repo extralit-hf-space variable read). Only main/develop
    # pushes deploy (release/** branches just build).
    if: |
      !cancelled() && needs.build.result == 'success' &&
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) &&
      (github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # GitHub environment gates protections/vars and shows the deployment URL in the PR/commit UI.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.event_name == 'pull_request' && 'preview' || 'develop' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Project linkage for the Vercel CLI (no .vercel/project.json needed when both are set).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Download frontend statics 📥
        # Reuse the env-agnostic SPA built by the `build` job (relative /api). The only
        # per-environment difference is the Vercel rewrite target assembled below.
        uses: actions/download-artifact@v4
        with:
          name: extralit-frontend
          path: frontend-dist

      - name: Resolve API_BASE_URL 🔎
        id: resolve
        # Order: PR's corresponding extralit-hf-space environment var -> hf-space repo default
        # var -> hard fallback. The built SPA proxies /api to this origin via the Vercel rewrite.
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_REPOSITORY_DISPATCH }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          HF_REPO="Extralit/extralit-hf-space"
          DEFAULT_URL="https://extralit-public-demo.hf.space"
          value=""
          # 1) PR build -> the PR's corresponding HF Space environment (extralit-dev/pr-<n>).
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_NUMBER:-}" ]]; then
            value=$(gh api "repos/${HF_REPO}/environments/pr-${PR_NUMBER}/variables/API_BASE_URL" \
              --jq '.value' 2>/dev/null || true)
          fi
          # 2) Repository-level default variable in extralit-hf-space.
          if [[ -z "$value" ]]; then
            value=$(gh api "repos/${HF_REPO}/actions/variables/API_BASE_URL" \
              --jq '.value' 2>/dev/null || true)
          fi
          # 3) Hard fallback so a deploy never breaks.
          if [[ -z "$value" ]]; then
            value="$DEFAULT_URL"
          fi
          value="${value%/}"   # strip trailing slash for clean path concatenation
          echo "api_base_url=$value" >> "$GITHUB_OUTPUT"
          echo "Resolved API_BASE_URL=$value"

      - name: Assemble Vercel prebuilt output 🧩
        # Build Output API v3: ship the prebuilt statics + a routes table that proxies /api and
        # /share-your-progress to the resolved backend, with SPA fallback to index.html.
        env:
          API_BASE_URL: ${{ steps.resolve.outputs.api_base_url }}
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static
          cp -r frontend-dist/. .vercel/output/static/
          test -f .vercel/output/static/index.html
          cat > .vercel/output/config.json <<EOF
          {
            "version": 3,
            "routes": [
              { "src": "/api/(.*)", "dest": "${API_BASE_URL}/api/\$1" },
              { "src": "/share-your-progress(.*)", "dest": "${API_BASE_URL}/share-your-progress\$1" },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          echo "----- .vercel/output/config.json -----"
          cat .vercel/output/config.json

      - name: Deploy to Vercel 🚀
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          PROD=""
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            PROD="--prod"
          fi
          # --prebuilt uploads .vercel/output as-is (no rebuild on Vercel); --archive=tgz
          # tarballs the upload (much faster for the SPA's many _nuxt/* chunks). URL -> stdout.
          url=$(vercel deploy --prebuilt --archive=tgz $PROD --token="$VERCEL_TOKEN" --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Alias develop deployment 🔗
        # A project has a single production (main); give develop a stable URL via an alias if
        # the `VERCEL_DEVELOP_ALIAS` repo variable is configured (e.g. extralit-frontend-develop.vercel.app).
        if: github.ref_name == 'develop'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEVELOP_ALIAS: ${{ vars.VERCEL_DEVELOP_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${DEVELOP_ALIAS:-}" ]]; then
            vercel alias set "${{ steps.deploy.outputs.url }}" "$DEVELOP_ALIAS" --token="$VERCEL_TOKEN" --yes
          else
            echo "No VERCEL_DEVELOP_ALIAS configured; skipping alias."
          fi

      - name: Comment preview URL on PR 💬
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            🚀 **Frontend preview deployed to Vercel**

            - Preview URL: ${{ steps.deploy.outputs.url }}
            - API target (`/api` → backend): `${{ steps.resolve.outputs.api_base_url }}`
          comment-tag: vercel_url
          reactions: rocket
