name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argilla
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: lazybit/minio
        volumes:
          - /data:/data
        env:
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        options: --name=minio --health-cmd "curl http://localhost:9000/minio/health/live"
        ports:
          - 9000:9000

    env:
      HF_HUB_DISABLE_TELEMETRY: 1
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: argilla
      RUN_FRONTEND_DEV: true

    permissions:
      contents: read # for actions/checkout

    # Define steps that will run before the Copilot agent starts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          pyproject-file: "argilla-server/pyproject.toml"
          python-version: "3.11"
          enable-cache: true
          cache-local-path: ~/.cache/uv
          cache-dependency-glob: "argilla-server/pdm.lock"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: argilla-frontend/package-lock.json

      - name: Install Python tools and argilla-server (editable)
        env:
          PDM_IGNORE_ACTIVE_VENV: 1
        run: |
          uv tool install pdm
          pdm config use_uv true
          pdm config python.install_root "$(uv python dir)"

          uv pip install pytest pytest-cov pytest-mock pytest-asyncio==0.21.1 pytest-env factory_boy~=3.2.1 pytest-randomly>=3.15.0 pre-commit
          cd argilla-server/
          pdm install --dev

      # Run argilla-server with live reload mode
      - name: Run Argilla server in development mode
        working-directory: argilla-server
        run: |
          pdm run server
        env:
          ENV: dev
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ env.POSTGRES_HOST }}
          S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ env.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ env.S3_SECRET_KEY }}

      - name: Install extralit (editable)
        run: |
          cd extralit/
          uv pip install -e .

      - name: Run frontend in dev mode (optional)
        if: ${{ always() && env.RUN_FRONTEND_DEV == 'true' }}
        working-directory: argilla-frontend
        env:
          API_BASE_URL: http://localhost:3000
        run: |
          npm install
          npm run dev
