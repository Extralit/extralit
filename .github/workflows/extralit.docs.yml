name: Publish documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "main"
      - "docs/**"
    paths:
      - ".github/workflows/extralit.docs.yml"
      - "extralit/docs/**"
      - "extralit/mkdocs.yml"

defaults:
  run:
    working-directory: extralit

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

    steps:
      - name: checkout docs-site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          pyproject-file: "extralit/pyproject.toml"
          python-version: "3.10"
          enable-cache: true
          cache-local-path: ~/.cache/uv
          ignore-nothing-to-cache: true
          cache-dependency-glob: "extralit/uv.lock"

      - name: Install dependencies
        run: |
          uv sync
          uv cache prune --ci

      - name: Set git credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Print GitHub ref info
        env:
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: echo "ref=$REF head_ref=$HEAD_REF"

      # Trunk is the bleeding edge, so `main` is what you get by default; `stable` is moved by
      # the tag step below. (Before the trunk-based migration this was inverted: `main` was
      # `stable` and `develop` was `latest`.)
      - name: Deploy Extralit docs (branch /main)
        run: |
          uv run mike deploy latest --push
          uv run mike set-default --push latest
        if: github.ref == 'refs/heads/main'

      - name: Deploy Extralit docs (release $version)
        run: |
          version=$(echo $TAG_VERSION | awk -F \. {'print $1"."$2'})
          echo "Deploying version ${version}"
          # `stable` as an alias of X.Y, --update-aliases so it moves off the previous release.
          uv run mike deploy "$version" stable --update-aliases --push
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - name: Delete Extralit docs (versions 'docs_*')
        id: delete_deployment
        run: |
          versions=$(uv run mike list)
          formatted_versions=$(echo "$versions" | tr ',' '\n' | tr -d '[]')
          for version in $versions; do
            if [[ $version == docs_* ]]; then
              echo "Deleting version: $version"
              uv run mike delete "$version" --push
            fi
          done
        if: startsWith(github.ref, 'refs/tags/')

      - name: Extract branch name
        id: extract_branch_name
        shell: bash
        run: echo "branch_name=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" | sed 's/\//_/g'  >> $GITHUB_OUTPUT

      - name: Deploy Extralit docs (branch /docs/*)
        run: uv run mike deploy ${{ steps.extract_branch_name.outputs.branch_name }} --prop-set hidden=true --push
        if: startsWith(github.ref, 'refs/heads/docs') || startsWith(github.head_ref, 'docs/')

      - name: Add deployment message in PR
        uses: mshick/add-pr-comment@v2
        if: startsWith(github.ref, 'refs/heads/docs') || startsWith(github.head_ref, 'docs/')
        with:
          message: |
            Docs for this PR have been deployed hidden from versioning: [https://docs.extralit.ai/${{ steps.extract_branch_name.outputs.branch_name }}](https://docs.extralit.ai/${{ steps.extract_branch_name.outputs.branch_name }})
