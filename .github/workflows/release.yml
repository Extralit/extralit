name: Release

# The whole release, in one dispatch:
#
#   gh workflow run release.yml -f version=X.Y.Z                    # dry run (the default): plan only
#   gh workflow run release.yml -f version=X.Y.Z -f dry_run=false   # cut it
#
# `cut` stamps the version and pushes `main`, `release` and `vX.Y.Z` in ONE atomic push, so all
# three always agree. Everything downstream is driven by those refs and lives in other workflows:
# `release` → production image → extralit/public-demo; the tag → PyPI, versioned docs, GitHub Release.
#
# Re-running with the same version is safe: `plan` detects a converged release and `cut` no-ops.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z (no leading v)"
        required: true
        type: string
      dry_run:
        description: "Plan only — push nothing"
        type: boolean
        default: true
      skip_ci_check:
        description: "Skip the green-CI assertion (use deliberately)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never two releases at once, and never cancel one halfway through its atomic push.
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    # Forks are inert: a fork's dispatch can't move this repo's refs, so don't pretend to try.
    if: github.repository == 'Extralit/extralit'
    runs-on: ubuntu-latest
    steps:
      # Short-lived (1h, auto-revoked at job end) and scoped to this repo, in place of a
      # long-lived PAT. The App's own permissions are the ceiling, so this token cannot be
      # repurposed the way a user PAT with blanket `repo` scope can.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.EXTRALIT_OPS_CLIENT_ID }}
          private-key: ${{ secrets.EXTRALIT_OPS_PRIVATE_KEY }}

      - name: Require admin or maintain
        env:
          # The App token reads collaborator permissions; GITHUB_TOKEN may not, depending on
          # repo settings. Falls back so a fresh checkout of this repo still works.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          role=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)
          echo "$ACTOR has role '$role' on $REPO"
          case "$role" in
            admin | maintain) ;;
            *)
              # Leads with the phrase release_guide.md tells operators to look for.
              echo "::error::Not authorized: '$ACTOR' needs admin or maintain to cut a release (has '$role')."
              exit 1
              ;;
          esac

  plan:
    name: Plan
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      base_sha: ${{ steps.base.outputs.sha }}
      already_done: ${{ steps.converged.outputs.already_done }}
      release_sha: ${{ steps.base.outputs.release_sha }}
    steps:
      - name: Validate version
        id: validate
        env:
          # Never interpolate ${{ inputs.* }} straight into a run: body — bind it to env first.
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Deliberately the same shape scripts/bump_version.py accepts, so the two can't disagree.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z with no leading 'v' (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history + tags: the convergence check reads out an existing tag's commit.
          fetch-depth: 0
          # This job only reads. Nothing here needs a credential in .git/config.
          persist-credentials: false

      - name: Resolve base commit and the current release pointer
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # The lease value for `cut`'s push. Empty when `release` does not exist yet (first
          # release) — git reads an empty <expect> as "the ref must not already exist". Asked of
          # the API rather than a local ref so it doesn't depend on what checkout happened to fetch.
          release_sha=$(gh api "repos/$REPO/git/ref/heads/release" --jq .object.sha 2>/dev/null || true)
          echo "Current refs/heads/release: ${release_sha:-<does not exist>}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already happened
        id: converged
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          VERSION: ${{ steps.validate.outputs.version }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null; then
            echo "Tag $TAG does not exist yet — this is a fresh release."
            echo "already_done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The tag exists. It's a converged re-run only if the commit it points at actually
          # carries this version; anything else is a collision a human has to resolve.
          #
          # Read the version straight out of the tag's tree. Deliberately NOT `git checkout $TAG`
          # + `bump_version.py`: that executes code from a commit this job did not vet, which is
          # exactly what github-release.yml is designed to avoid. `|| true` because the step runs
          # under `pipefail` and an old tag may predate one of these paths — a missing file must
          # read as a mismatch, not abort the step.
          at_tag() { git show "$TAG:$1" 2>/dev/null || true; }
          py_version() { at_tag "$1" | sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p'; }

          sdk=$(py_version extralit/src/extralit/_version.py)
          server=$(py_version extralit-server/src/extralit_server/_version.py)
          frontend=$(at_tag extralit-frontend/package.json | jq -r '.version // empty')

          if [[ "$sdk" == "$VERSION" && "$server" == "$VERSION" && "$frontend" == "$VERSION" ]]; then
            echo "Tag $TAG already points at a commit stamped $VERSION — nothing to do."
            echo "already_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG already exists at a different commit \
          ($(git rev-parse --short "$TAG^{commit}") — sdk=${sdk:-?} server=${server:-?} frontend=${frontend:-?}, \
          expected $VERSION). If this is recovery, delete the tag first: git push origin :refs/tags/$TAG"
            exit 1
          fi

      - name: Assert CI is green on the base commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # Filter out this workflow, otherwise a dispatch from `main` waits on its own run forever.
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$BASE_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name != "Release") | {name, status, conclusion}]')

          # All three branches lead with "CI is not green on main" — the phrase release_guide.md
          # tells operators to search the log for — then say which of the three cases it is.
          total=$(jq length <<< "$runs")
          if [[ "$total" -eq 0 ]]; then
            echo "::error::CI is not green on main ($BASE_SHA): no workflow runs found at all. \
          Nothing has validated this commit — wait for CI, or re-run with skip_ci_check=true if it \
          genuinely has no applicable workflows."
            exit 1
          fi

          pending=$(jq -r '[.[] | select(.status != "completed") | .name] | join(", ")' <<< "$runs")
          if [[ -n "$pending" ]]; then
            echo "::error::CI is not green on main ($BASE_SHA): still running — $pending. \
          Wait for it to finish."
            exit 1
          fi

          failed=$(jq -r '[.[] | select(.conclusion | IN("success","skipped","neutral") | not) | .name] | join(", ")' <<< "$runs")
          if [[ -n "$failed" ]]; then
            echo "::error::CI is not green on main ($BASE_SHA): failing — $failed. \
          Fix it, or re-run with skip_ci_check=true."
            exit 1
          fi

          echo "All $total workflow run(s) on $BASE_SHA are green."

      - name: Write the plan
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ALREADY_DONE: ${{ steps.converged.outputs.already_done }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_CI_CHECK: ${{ inputs.skip_ci_check }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then mode='**DRY RUN** — nothing will be pushed'; else mode='**EXECUTE**'; fi

          {
            echo "## Release plan"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Mode | $mode |"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Base commit | [\`${BASE_SHA:0:12}\`](https://github.com/$REPO/commit/$BASE_SHA) on \`main\` |"
            echo "| Converged already | \`$ALREADY_DONE\` |"
            echo "| CI check | $([[ "$SKIP_CI_CHECK" == "true" ]] && echo 'skipped by request' || echo 'green') |"
            echo
            if [[ "$ALREADY_DONE" == "true" ]]; then
              echo "\`$TAG\` already points at a commit stamped \`$VERSION\`. Every job below is a no-op."
            elif [[ "$DRY_RUN" == "true" ]]; then
              echo "Re-run with \`-f dry_run=false\` to stamp \`$VERSION\` and push"
              echo "\`main\`, \`release\` and \`$TAG\` atomically."
            else
              echo "Stamping \`$VERSION\` onto \`${BASE_SHA:0:12}\` and pushing"
              echo "\`main\`, \`release\` and \`$TAG\` atomically."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cut:
    name: Cut
    needs: [authorize, plan]
    if: ${{ !inputs.dry_run && needs.plan.outputs.already_done != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Minted again here: tokens don't cross job boundaries, and this one expires in an hour
      # rather than sitting in org settings until someone notices it stopped working.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.EXTRALIT_OPS_CLIENT_ID }}
          private-key: ${{ secrets.EXTRALIT_OPS_PRIVATE_KEY }}

      - name: Checkout the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          # An App token, NOT GITHUB_TOKEN: pushes made with GITHUB_TOKEN emit no
          # downstream `push` events, so the tag would never trigger PyPI, docs, or the Release.
          token: ${{ steps.app-token.outputs.token }}
          # The next step runs repository code (bump_version.py). This token pushes straight to
          # `main`/`release`/tags past branch protection, so don't leave it in .git/config while
          # that happens — the push step below supplies it explicitly, and only to itself.
          persist-credentials: false
          fetch-depth: 0

      - name: Stamp the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py set --version "$VERSION"
          python3 scripts/bump_version.py check --expect "$VERSION"

      - name: Commit and push main + release + tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          # What `plan` saw at refs/heads/release; empty if the branch doesn't exist yet.
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          # Scoped to this step alone — see persist-credentials above. Actions masks it in logs.
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Empty when re-running after a partial failure that already stamped and committed.
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -aqm "release: $TAG"
          else
            echo "Already stamped at $VERSION; reusing $(git rev-parse --short HEAD)."
          fi
          git tag "$TAG"

          # --atomic: either all three refs move or none do. A stale `main` fails the whole push
          # rather than leaving a tag with no branch (or worse, a release with no tag).
          #
          # `release` is a production *pointer*, not a branch that accumulates work, so it moves
          # deliberately rather than by fast-forward — otherwise a rollback (release_guide.md
          # force-moves it back to an earlier tag) can leave it off `main`'s ancestry and abort
          # the next release *after* the version was already stamped and committed. The lease is
          # scoped to this one ref, so `main` and the tag stay strictly non-forced; if anyone
          # moved `release` since `plan` read it, the push is rejected instead of clobbering.
          # An empty RELEASE_SHA means "must not already exist" — the first release.
          git push --atomic \
            --force-with-lease=refs/heads/release:"$RELEASE_SHA" \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/main" \
            "HEAD:refs/heads/release" \
            "refs/tags/$TAG"

      - name: What happens next
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## Released \`$TAG\`"
            echo
            echo "\`main\`, \`release\` and \`$TAG\` now point at the same commit. Watch:"
            echo
            echo "- [Actions](https://github.com/$REPO/actions) — \`release\` builds the multi-arch"
            echo "  production image and restarts the public demo; \`$TAG\` publishes to PyPI,"
            echo "  deploys the \`v${VERSION%.*}\` docs, and creates the GitHub Release."
            echo "- <https://extralit-public-demo.hf.space/api/v1/status> — should report \`$VERSION\`."
            echo "- <https://pypi.org/project/extralit/$VERSION/> and"
            echo "  <https://pypi.org/project/extralit-server/$VERSION/>"
            echo
            echo "To roll back: re-point \`release\` at the previous tag and restart the Space."
          } >> "$GITHUB_STEP_SUMMARY"
