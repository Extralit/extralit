repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: extralit/mkdocs.yml|examples/deployments/k8s
      - id: end-of-file-fixer
        exclude_types: [text, jupyter]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.30
    hooks:
      - id: uv-lock
        name: "Lock extralit dependencies"
        files: '^extralit/pyproject\.toml$'
        args: [--directory, extralit]
      - id: uv-lock
        name: "Lock extralit-server dependencies"
        files: '^extralit-server/pyproject\.toml$'
        args: [--directory, extralit-server]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  ##############################################################################
  # extralit SDK specific hooks
  ##############################################################################

  # (Removed duplicate ruff hook for extralit SDK; global ruff hook above
  # now serves as single source of truth using pyproject.toml configuration)

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: '^extralit/.*\.ipynb$'
        args:
          - --keep-count
          - --keep-output
          # - --keep-prompt-number
          # - --keep-cell-ids
          # - --keep-markdown
          # - --keep-output-timestamp
          # - --keep-execution-count
          # - --keep-metadata
          # - --keep-version

  ##############################################################################
  # extralit-server specific hooks
  ##############################################################################


  ##############################################################################
  # extralit-frontend specific hooks
  ##############################################################################
  - repo: local
    hooks:
      - id: frontend-lint
        name: "Lint and fix extralit-frontend files"
        # pre-commit passes repo-relative paths (extralit-frontend/foo.vue). The trailing
        # `--` is the placeholder $0 (otherwise `bash -c` assigns the first file to $0 and
        # "$@" drops it); `${@#extralit-frontend/}` strips the prefix so paths resolve after
        # the cd. `|| true` keeps lint advisory (non-blocking), matching `eslint . --quiet`.
        entry: bash -c 'cd extralit-frontend && npx eslint --fix --cache "${@#extralit-frontend/}" || true' --
        language: system
        files: '^extralit-frontend/.*\.(js|ts|vue)$'
        pass_filenames: true

  ##############################################################################
  # Helm lint hook
  ##############################################################################
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
        name: Helm lint
        files: '^examples/deployments/k8s/.*\.yaml$'
        args: ["helm", "lint", "examples/deployments/k8s/"]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip:
    - helmlint # Disabling helmlint on CI by now because helm dependency is not available
    - frontend-eslint # Requires npm dependencies to be installed in extralit-frontend
    - frontend-prettier # Requires npm dependencies to be installed in extralit-frontend
    - frontend-lint # Requires npm dependencies to be installed in extralit-frontend
  submodules: false
