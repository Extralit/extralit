apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: extralit-server-certificate
spec:
  dnsNames:
  - argilla-hostname
  secretName: extralit-server-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer